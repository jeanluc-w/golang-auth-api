name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, tidy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt is clean
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -cover

  integration-test:
    name: Integration tests (Docker/testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: test/integration/go.mod

      - name: go mod tidy is clean
        working-directory: test/integration
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt is clean
        working-directory: test/integration
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        working-directory: test/integration
        run: go vet ./...

      - name: govulncheck
        working-directory: test/integration
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go test (spins up real Postgres + Redis containers)
        working-directory: test/integration
        run: go test ./... -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t auth-api:ci .
